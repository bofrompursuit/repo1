<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Weather — Global Cities</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>🌤 Simple Weather</h1>

    <form id="searchForm" autocomplete="off">
      <label for="cityInput">City (searches worldwide)</label>
      <div class="search-row">
        <input id="cityInput" name="city" placeholder="Type a city name" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" />
        <button type="submit" id="searchBtn">Get</button>
      </div>

      <ul id="suggestions" role="listbox" aria-label="City suggestions" hidden></ul>

      <div class="units">
        <label><input type="radio" name="unit" value="metric" checked> Celsius (°C)</label>
        <label><input type="radio" name="unit" value="imperial"> Fahrenheit (°F)</label>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite" class="status"></div>

    <section id="weatherCard" class="weather" hidden>
      <h2 id="cityName"></h2>
      <div class="temp" id="temp"></div>
      <div id="desc" class="desc"></div>

      <div class="grid">
        <div><strong>Feels</strong><div id="feels"></div></div>
        <div><strong>Humidity</strong><div id="humidity"></div></div>
        <div><strong>Wind</strong><div id="wind"></div></div>
        <div><strong>Pressure</strong><div id="pressure"></div></div>
      </div>

      <div class="footer">Last updated: <span id="updated"></span></div>
    </section>

    <p class="hint">Tip: The search uses OpenWeatherMap geocoding to find cities worldwide. Replace API_KEY in <code>script.js</code> with your own key.</p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
