<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #444;
            font-size: 0.9em;
        }

        input, select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .unit-toggle {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .unit-toggle label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .unit-toggle input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .weather-display {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            text-align: center;
            display: none;
            margin-top: 20px;
        }

        .weather-display.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .city-name {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 4em;
            font-weight: 700;
            margin: 20px 0;
        }

        .weather-desc {
            font-size: 1.3em;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
        }

        .detail-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .detail-value {
            font-size: 1.2em;
            font-weight: 600;
            margin-top: 5px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
            margin-top: 20px;
        }

        .error.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.1em;
            display: none;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Global Weather</h1>
        
        <div class="controls">
            <div class="input-group">
                <label for="cityInput">Enter City Name</label>
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="e.g., London, Tokyo, New York"
                    list="cities"
                >
                <datalist id="cities">
                    <option value="London">
                    <option value="New York">
                    <option value="Tokyo">
                    <option value="Paris">
                    <option value="Sydney">
                    <option value="Dubai">
                    <option value="Singapore">
                    <option value="Hong Kong">
                    <option value="Mumbai">
                    <option value="Los Angeles">
                    <option value="Chicago">
                    <option value="Toronto">
                    <option value="Berlin">
                    <option value="Madrid">
                    <option value="Rome">
                    <option value="Amsterdam">
                    <option value="Moscow">
                    <option value="Seoul">
                    <option value="Bangkok">
                    <option value="Istanbul">
                    <option value="Mexico City">
                    <option value="São Paulo">
                    <option value="Buenos Aires">
                    <option value="Cairo">
                    <option value="Lagos">
                    <option value="Shanghai">
                    <option value="Beijing">
                    <option value="Delhi">
                    <option value="Bangalore">
                    <option value="Melbourne">
                </datalist>
            </div>

            <div class="input-group">
                <label>Temperature Unit</label>
                <div class="unit-toggle">
                    <label>
                        <input type="radio" name="unit" value="metric" checked>
                        Celsius (°C)
                    </label>
                    <label>
                        <input type="radio" name="unit" value="imperial">
                        Fahrenheit (°F)
                    </label>
                </div>
            </div>

            <button onclick="getWeather()">Get Weather</button>
        </div>

        <div class="loading" id="loading">
            Loading weather data...
        </div>

        <div class="error" id="error"></div>

        <div class="weather-display" id="weatherDisplay">
            <div class="city-name" id="cityName"></div>
            <div class="temperature" id="temperature"></div>
            <div class="weather-desc" id="description"></div>
            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Pressure</div>
                    <div class="detail-value" id="pressure"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'f9e9a0b8e77a4f36b9e9a0b8e77a4f36'; // Using a demo key for illustration
        
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            const unit = document.querySelector('input[name="unit"]:checked').value;
            
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            hideAll();
            showLoading();

            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=${unit}&appid=${API_KEY}`
                );

                if (!response.ok) {
                    throw new Error('City not found');
                }

                const data = await response.json();
                displayWeather(data, unit);
            } catch (error) {
                hideLoading();
                showError('Unable to fetch weather data. Please check the city name and try again.');
            }
        }

        function displayWeather(data, unit) {
            hideLoading();
            
            const tempUnit = unit === 'metric' ? '°C' : '°F';
            const speedUnit = unit === 'metric' ? 'm/s' : 'mph';

            document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
            document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}${tempUnit}`;
            document.getElementById('description').textContent = data.weather[0].description;
            document.getElementById('feelsLike').textContent = `${Math.round(data.main.feels_like)}${tempUnit}`;
            document.getElementById('humidity').textContent = `${data.main.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.wind.speed} ${speedUnit}`;
            document.getElementById('pressure').textContent = `${data.main.pressure} hPa`;

            document.getElementById('weatherDisplay').classList.add('show');
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function showLoading() {
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function hideAll() {
            document.getElementById('weatherDisplay').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            document.getElementById('loading').classList.remove('show');
        }

        // Allow Enter key to trigger search
        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getWeather();
            }
        });
    </script>
</body>
</html>
