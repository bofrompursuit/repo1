<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🌍 Global Weather</h1>
        
        <div class="controls">
            <div class="input-group">
                <label for="cityInput">Enter City Name</label>
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="e.g., London, Tokyo, New York"
                    list="cities"
                >
                <datalist id="cities">
                    <option value="London">
                    <option value="New York">
                    <option value="Tokyo">
                    <option value="Paris">
                    <option value="Sydney">
                    <option value="Dubai">
                    <option value="Singapore">
                    <option value="Hong Kong">
                    <option value="Mumbai">
                    <option value="Los Angeles">
                    <option value="Chicago">
                    <option value="Toronto">
                    <option value="Berlin">
                    <option value="Madrid">
                    <option value="Rome">
                    <option value="Amsterdam">
                    <option value="Moscow">
                    <option value="Seoul">
                    <option value="Bangkok">
                    <option value="Istanbul">
                    <option value="Mexico City">
                    <option value="São Paulo">
                    <option value="Buenos Aires">
                    <option value="Cairo">
                    <option value="Lagos">
                    <option value="Shanghai">
                    <option value="Beijing">
                    <option value="Delhi">
                    <option value="Bangalore">
                    <option value="Melbourne">
                </datalist>
            </div>

            <div class="input-group">
                <label>Temperature Unit</label>
                <div class="unit-toggle">
                    <label>
                        <input type="radio" name="unit" value="metric" checked>
                        Celsius (°C)
                    </label>
                    <label>
                        <input type="radio" name="unit" value="imperial">
                        Fahrenheit (°F)
                    </label>
                </div>
            </div>

            <button onclick="getWeather()">Get Weather</button>
        </div>

        <div class="loading" id="loading">
            Loading weather data...
        </div>

        <div class="error" id="error"></div>

        <div class="weather-display" id="weatherDisplay">
            <div class="city-name" id="cityName"></div>
            <div class="temperature" id="temperature"></div>
            <div class="weather-desc" id="description"></div>
            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Pressure</div>
                    <div class="detail-value" id="pressure"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'f9e9a0b8e77a4f36b9e9a0b8e77a4f36'; // Using a demo key for illustration
        
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            const unit = document.querySelector('input[name="unit"]:checked').value;
            
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            hideAll();
            showLoading();

            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=${unit}&appid=${API_KEY}`
                );

                if (!response.ok) {
                    throw new Error('City not found');
                }

                const data = await response.json();
                displayWeather(data, unit);
            } catch (error) {
                hideLoading();
                showError('Unable to fetch weather data. Please check the city name and try again.');
            }
        }

        function displayWeather(data, unit) {
            hideLoading();
            
            const tempUnit = unit === 'metric' ? '°C' : '°F';
            const speedUnit = unit === 'metric' ? 'm/s' : 'mph';

            document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
            document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}${tempUnit}`;
            document.getElementById('description').textContent = data.weather[0].description;
            document.getElementById('feelsLike').textContent = `${Math.round(data.main.feels_like)}${tempUnit}`;
            document.getElementById('humidity').textContent = `${data.main.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.wind.speed} ${speedUnit}`;
            document.getElementById('pressure').textContent = `${data.main.pressure} hPa`;

            document.getElementById('weatherDisplay').classList.add('show');
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function showLoading() {
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function hideAll() {
            document.getElementById('weatherDisplay').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            document.getElementById('loading').classList.remove('show');
        }

        // Allow Enter key to trigger search
        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getWeather();
            }
        });
    </script>
</body>
</html>
